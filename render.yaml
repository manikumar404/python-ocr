# Render Blueprint for the Bhutan document + liveness verification prototype.
#
# This is a Docker deploy rather than one of Render's native Python runtimes
# because the app needs two system packages that a plain `pip install` cannot
# provide: the `tesseract` OCR binary behind pytesseract, and the libGL/libglib
# libraries that opencv-contrib-python's wheel links against. The Dockerfile
# already installs both, so Render just builds and runs it.
services:
  - type: web
    name: bhutan-kyc-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Closest Render region to Bhutan.
    region: singapore

    # `free` is deliberate: a Blueprint only demands a payment method when it
    # asks for a paid plan, so this keeps the deploy card-free. Free gives
    # 512MB, and one in-flight verification peaks at ~280MB RSS (both ONNX
    # models resident plus a decoded liveness clip), so a single demo session
    # fits with headroom.
    #
    # What you trade away: free instances spin down after 15 minutes idle, and
    # waking an 808MB image costs the next visitor roughly a minute. Before
    # demoing, load the URL once to warm it. Two people running the flow at the
    # same time would also crowd 512MB -- `standard` (2GB) is the fix, but it
    # needs billing.
    plan: free

    # /api/health is a plain 200 with no model loading, so Render can tell the
    # process is up without waiting on the ~37MB SFace weights to page in.
    healthCheckPath: /api/health

    autoDeploy: true
