# Serves the static frontend and reverse-proxies /api to the backend service.
# index.html calls the API with same-origin paths (fetch("/api/...")), so
# proxying here means the page needs no API URL configured.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness clips and document photos are uploaded through this proxy;
    # nginx's 1MB default would reject them with a 413.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Video analysis can take a while on a small CPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
